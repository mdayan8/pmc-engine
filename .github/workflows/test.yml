name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e .

      - name: Run tests
        run: |
          pytest tests/ -v --cov=pmc --cov-report=term-missing --cov-fail-under=75

      - name: Run integration tests
        run: |
          pytest tests/test_integration.py -v

      - name: Run benchmark
        run: |
          python -c "
          from pmc import PMCEngine
          engine = PMCEngine()
          stats = engine.index('tests/test_fixtures/sample_auth')
          r = engine.compress('Fix the bug in login', source_root='tests/test_fixtures/sample_auth')
          print(f'INDEX: {stats}')
          print(f'RESULT: {r.summary()}')
          assert r.token_count < r.naive_token_count, 'No reduction!'
          print('BENCHMARK: PASSED')
          "
