<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="'SF Mono','Menlo','Consolas',monospace">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0c10;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10141a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="280" fill="url(#bg2)" rx="12"/>
  <rect x="0" y="0" width="600" height="280" fill="none" stroke="#1a2028" stroke-width="1" rx="12"/>

  <text x="300" y="30" text-anchor="middle" fill="#e0e8f0" font-size="16" font-weight="bold">Quality Verification Results</text>

  <!-- 100% circle -->
  <circle cx="160" cy="130" r="60" fill="none" stroke="#1a2028" stroke-width="8"/>
  <circle cx="160" cy="130" r="60" fill="none" stroke="#00e5a0" stroke-width="8" stroke-dasharray="377" stroke-dashoffset="0" stroke-linecap="round"/>
  <text x="160" y="125" text-anchor="middle" fill="#00e5a0" font-size="28" font-weight="bold">100%</text>
  <text x="160" y="145" text-anchor="middle" fill="#5a6a7a" font-size="10">Quality Score</text>
  <text x="160" y="210" text-anchor="middle" fill="#5a6a7a" font-size="10" font-weight="bold">10/10 tasks passed</text>

  <!-- Bars -->
  <text x="280" y="70" fill="#5a6a7a" font-size="10">Token Reduction</text>
  <rect x="280" y="76" width="280" height="16" fill="#1a2028" rx="3"/>
  <rect x="280" y="76" width="242" height="16" fill="url(#pmc-grad)" rx="3" opacity="0.8"/>
  <text x="510" y="88" fill="#00e5a0" font-size="11" font-weight="bold">86.7%</text>

  <text x="280" y="110" fill="#5a6a7a" font-size="10">Tasks Passed</text>
  <rect x="280" y="116" width="280" height="16" fill="#1a2028" rx="3"/>
  <rect x="280" y="116" width="280" height="16" fill="#00e5a0" rx="3" opacity="0.8"/>
  <text x="530" y="128" fill="#00e5a0" font-size="11" font-weight="bold">10/10</text>

  <text x="280" y="150" fill="#5a6a7a" font-size="10">Cost Reduction</text>
  <rect x="280" y="156" width="280" height="16" fill="#1a2028" rx="3"/>
  <rect x="280" y="156" width="271" height="16" fill="#0099ff" rx="3" opacity="0.8"/>
  <text x="530" y="168" fill="#0099ff" font-size="11" font-weight="bold">97%</text>

  <text x="280" y="190" fill="#5a6a7a" font-size="10">Self-Improvement (auto-tune on failure)</text>
  <rect x="280" y="196" width="280" height="16" fill="#1a2028" rx="3"/>
  <rect x="280" y="196" width="280" height="16" fill="#ffcc00" rx="3" opacity="0.8"/>
  <text x="530" y="208" fill="#ffcc00" font-size="11" font-weight="bold">✅ ACTIVE</text>

  <!-- Note -->
  <text x="300" y="255" text-anchor="middle" fill="#5a6a7a" font-size="10">Verification runs 20 tasks with and without PMC → measures delta → auto-fixes dependency graph</text>
</svg>
