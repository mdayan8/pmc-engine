<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'SF Mono','Menlo','Consolas',monospace">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1d24;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d0f14;stop-opacity:1"/>
    </linearGradient>
    <style>
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      @keyframes slideIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
      @keyframes fadeIn { from{opacity:0} to{opacity:1} }
      @keyframes barGrow { from{width:0px} }
      .blink { animation: blink 1s infinite }
      .s1 { animation: slideIn 0.4s ease forwards; opacity:0 }
      .s2 { animation: slideIn 0.4s ease 0.5s forwards; opacity:0 }
      .s3 { animation: slideIn 0.4s ease 1.0s forwards; opacity:0 }
      .s4 { animation: slideIn 0.4s ease 1.5s forwards; opacity:0 }
      .s5 { animation: fadeIn 0.6s ease 2.0s forwards; opacity:0 }
      .bar1 { animation: barGrow 1.2s ease 2.5s forwards; width:0 }
      .bar2 { animation: barGrow 1.2s ease 3.0s forwards; width:0 }
    </style>
  </defs>

  <!-- Terminal window -->
  <rect x="10" y="10" width="700" height="360" fill="url(#term-bg)" rx="8"/>
  <rect x="10" y="10" width="700" height="30" fill="#232730" rx="8"/>
  <circle cx="25" cy="25" r="5" fill="#ff5c5c"/>
  <circle cx="40" cy="25" r="5" fill="#ffcc00"/>
  <circle cx="55" cy="25" r="5" fill="#00e5a0"/>
  <text x="360" y="29" text-anchor="middle" fill="#5a6a7a" font-size="10">pmc-claude — ~/fastapi-test</text>

  <!-- Terminal content -->
  <text x="20" y="58" fill="#5a6a7a" font-size="11" class="s1">$ pmc compress "Fix the race condition in login"</text>

  <text x="20" y="80" fill="#00e5a0" font-size="11" class="s2"># PMC Context — Operation: DEBUG [balanced]</text>
  <text x="20" y="96" fill="#5a6a7a" font-size="11" class="s2"># Query: Fix the race condition in login</text>
  <text x="20" y="112" fill="#5a6a7a" font-size="11" class="s2"># ═══ TIER 1: FULL CODE ═══</text>
  <text x="20" y="130" fill="#0099ff" font-size="11" class="s2">def login(self, email, password, ip):</text>
  <text x="20" y="146" fill="#5a6a7a" font-size="11" class="s2">    if not self.rate_limiter.check(ip):</text>
  <text x="20" y="156" fill="#5a6a7a" font-size="11" class="s2">        raise RateLimitException(...)</text>
  <text x="20" y="166" fill="#5a6a7a" font-size="11" class="s2">    ...</text>

  <text x="20" y="186" fill="#5a6a7a" font-size="11" class="s3"># ═══ TIER 2: SIGNATURES ═══</text>
  <text x="20" y="202" fill="#5a6a7a" font-size="11" class="s3"># def verify_password(plain,hash)→bool  [crypto.py:14]</text>
  <text x="20" y="216" fill="#5a6a7a" font-size="11" class="s3"># def query(sql,params)→Optional[Any]  [database.py:19]</text>

  <text x="20" y="236" fill="#5a6a7a" font-size="11" class="s4"># ═══ TIER 3: STUBS ═══</text>
  <text x="20" y="252" fill="#5a6a7a" font-size="11" class="s4"># [STUB] log_failed_login(24 lines) → audit.py:33</text>
  <text x="20" y="266" fill="#5a6a7a" font-size="11" class="s4"># Mention any stub name to auto-expand it.</text>

  <!-- Stats bar -->
  <rect x="20" y="285" width="660" height="70" fill="#12161c" rx="6" class="s5"/>
  <rect x="20" y="285" width="660" height="70" fill="none" stroke="#1a2028" stroke-width="1" rx="6" class="s5"/>

  <text x="50" y="308" fill="#ff5c5c" font-size="10">NAIVE</text>
  <rect x="50" y="314" width="150" height="8" fill="#1a2028" rx="4" class="s5"/>
  <rect x="50" y="314" width="150" height="8" fill="#ff5c5c" rx="4" class="s5 bar1"/>
  <text x="60" y="320" fill="#fff" font-size="7">202,131 tokens</text>

  <text x="50" y="340" fill="#00e5a0" font-size="10">PMC</text>
  <rect x="50" y="346" width="150" height="8" fill="#1a2028" rx="4" class="s5"/>
  <rect x="50" y="346" width="6" height="8" fill="#00e5a0" rx="4" class="s5 bar2"/>
  <text x="60" y="352" fill="#fff" font-size="7">7,119 tokens (96.5% reduction)</text>

  <text x="320" y="320" fill="#ffcc00" font-size="18" font-weight="bold" class="s5">96.5%</text>
  <text x="320" y="338" fill="#5a6a7a" font-size="9" class="s5">fewer tokens</text>

  <text x="420" y="320" fill="#00e5a0" font-size="18" font-weight="bold" class="s5">$0.05</text>
  <text x="420" y="338" fill="#5a6a7a" font-size="9" class="s5">cost vs $0.60</text>

  <text x="530" y="320" fill="#0099ff" font-size="18" font-weight="bold" class="s5">3ms</text>
  <text x="530" y="338" fill="#5a6a7a" font-size="9" class="s5">overhead</text>

  <text x="20" y="370" fill="#00e5a0" font-size="10" class="blink">▌</text>
</svg>
