[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmc-engine"
version = "0.1.0"
description = "Predictive Minimal Context — cut AI coding token costs by 40-80% via AST-based surgical context compression"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["claude", "llm", "tokens", "context", "compression", "coding", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
]
proxy = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sse-starlette>=2.0",
]
mcp = [
    "mcp>=1.0",
]
semantic = [
    "sentence-transformers>=3",
    "torch>=2.0",
]
treesitter = [
    "tree-sitter-language-pack>=1.8",
]
all = [
    "pmc-engine[dev,proxy,mcp,semantic,treesitter]",
]

[project.scripts]
pmc = "pmc.cli:main"

[project.urls]
Homepage = "https://github.com/pmc-engine/pmc"
Source = "https://github.com/pmc-engine/pmc"
Documentation = "https://github.com/pmc-engine/pmc/docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
